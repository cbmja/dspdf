server:
  port: 9090

spring:
  application:
    name: Pdf

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
      
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:daishin};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

mybatis:
  mapper-locations: mapper/*.xml
  type-aliases-package: com.daishin.pdf.dto
#  configuration:
#    map-underscore-to-camel-case: true
    
storage:
  logPath: ${LOG_PATH:D:/DATA/logs}
  receivingPath: ${RECEIVING_PATH:D:/DATA/receiving/}
  completePath: ${COMPLETE_PATH:D:/DATA/complete/}

scheduler:
  enabled: ${SCHEDULER_ENABLED:true}

